providers:
  - provider_id: "vectorengine-healthbench-professional-grader"
    kind: "openai-compatible"
    endpoint: "${VECTOR_ENGINE_BASE_URL:-https://api.vectorengine.ai/v1}"
    max_concurrency: 8
    api_key_env: "VECTOR_ENGINE_API_KEY"

# Evaluator-only catalog. This exact provider model is absent from the
# AgentGraph Executor catalog and cannot be selected by Flow-Director.
models:
  - model_id: "healthbench-professional-reference-grader"
    provider_id: "vectorengine-healthbench-professional-grader"
    model_name: "gpt-5.4-2026-03-05"
    selection_weight: 1.0
    cheap_weight: 1.0
    fast_weight: 1.0
    metadata:
      family: "gpt"
      profile: "evaluator_only;healthbench_professional;responses_api;reasoning_effort=low"
      max_tokens: "4096"
