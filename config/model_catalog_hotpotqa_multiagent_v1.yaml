providers:
  - provider_id: "local-director"
    kind: "openai-compatible"
    endpoint: "http://127.0.0.1:8015/v1"
    max_concurrency: 32

  - provider_id: "vectorengine"
    kind: "openai-compatible"
    endpoint: "${VECTOR_ENGINE_BASE_URL:-https://api.vectorengine.ai/v1}"
    max_concurrency: 64
    api_key_env: "VECTOR_ENGINE_API_KEY"

# Step0-v1 exposes equal routing priors.  The Director chooses among exact,
# canary-backed IDs using the task and the neutral routing metadata; there is
# no hard-coded role/model recipe and no sampled preferred-model hint.
models:
  - model_id: "qwen3.5-9b-local"
    provider_id: "local-director"
    model_name: "supervisor_theta"
    selection_weight: 1.0
    cheap_weight: 1.0
    fast_weight: 1.0
    context_window: 8192
    metadata:
      family: "qwen"
      profile: "text_qa"
      text_qa_canary: "passed_prior_hotpot_run"
      canary_source: "hotpotqa_training_ready_step0"
      chat_template_enable_thinking: "false"
      max_tokens: "4096"

  - model_id: "qwen3.5-flash"
    provider_id: "vectorengine"
    model_name: "qwen3.5-flash"
    selection_weight: 1.0
    cheap_weight: 1.0
