# One real joint-QA LoRA/GRPO update after the evidence gate activates Skills.
# This file is intentionally not runnable until every __REPLACE_* Skill field
# is bound to the frozen, version-compatible ACTIVE SkillStore snapshot.

schema_version: "flowsteer.agentgraph.config.v1"
experiment:
  name: "joint_qa_progressive_skill_on_micro_step1"
  phase: "joint_qa_micro_training"
  training_enabled: true
  seed: 20260818
  update_step: 1
  sampling_anchor_ordinal: 1
  condition_id: "joint_qa_progressive_skill_on_micro"
  catalog_order_namespace: "joint_qa_progressive_shared_v1"
  prompt_version: "agentgraph.director.progressive_subgraph.v1"
  tool_version: "agentgraph.add-subgraph+skillflow-public-retrieval.v1"
  output_dir: "artifacts/joint_qa_progressive/training/step_000001/checkpoint"

data:
  catalog_path: "config/datasets_agentgraph.yaml"
  train_path: "data/joint_qa_v2/train.jsonl"
  validation_path: "data/joint_qa_v2/development.jsonl"
  skill_confirmation_path: "data/joint_qa_v2/skill_confirmation.jsonl"
  test_path: "data/joint_qa_v2/test.jsonl"
  enforce_split_isolation: true
  task_schema_version: "flowsteer.agentgraph.task.v1"
  joint_qa_micro:
    split: "train"
    dataset_keys: [hotpotqa, triviaqa]
    selection: "frozen_joint_qa_schedule"
    expected_total_tasks: 2
    # Train-only tasks selected before rollout because each admits independent
    # evidence branches followed by semantic fan-in.  They are disjoint from
    # both Skill evidence epochs and every held-out partition.
    task_positions:
      hotpotqa: [9]
      triviaqa: [12]
    schedule_path: "artifacts/joint_qa_progressive/training/step_000001/frozen_schedule.json"
    cursor_path: "artifacts/joint_qa_progressive/training/step_000001/cursor_step_000000.json"
    next_cursor_path: "artifacts/joint_qa_progressive/training/step_000001/cursor_step_000001.json"
    retrieval:
      enabled: true
      mode: "deterministic_question_query_prefetch"
      query_policy: "stop_word_filtered_first_12_unique_terms"
      skillflow_source: "/home/test/SKILLEV/skillflow-bayesian-improve-deploy/src"
      index_path: "/ssd1/iclr/SKILLEV/skillev-new-b2-temp/data/datasets/dpr-wikipedia/atlas-retrieval.sqlite3"
      search_limit: 5

storage:
  schema_version: "flowsteer.agentgraph.v1"
  root: "artifacts/joint_qa_progressive/training/step_000001/evidence"
  trajectory_format: "jsonl"
  deduplicate_by_event_id: true
  persist_exact_policy_receipts: true
  selected_tasks_path: "artifacts/joint_qa_progressive/training/step_000001/selected_tasks.jsonl"
  retrieval_receipts_path: "artifacts/joint_qa_progressive/training/step_000001/retrieval_receipts.jsonl"
  trajectories_path: "artifacts/joint_qa_progressive/training/step_000001/trajectories.jsonl"
  grpo_groups_path: "artifacts/joint_qa_progressive/training/step_000001/grpo_groups.jsonl"
  manifest_path: "artifacts/joint_qa_progressive/training/step_000001/training_manifest.json"
  behavior_policy_preflight_path: "artifacts/joint_qa_progressive/training/step_000001/behavior_policy_preflight.json"
  sync_receipt_path: "artifacts/joint_qa_progressive/training/step_000001/sync_receipt.json"
  skill_lifecycle_receipt_path: "artifacts/joint_qa_progressive/training/step_000001/skill_lifecycle_receipt.json"
  post_update_trajectories_path: "artifacts/joint_qa_progressive/training/step_000001/post_update_trajectories.jsonl"

director:
  base_model: "${QWEN35_9B_MODEL_PATH:-/home/test/SKILLEV/skillev-new-b2-temp/model/Qwen3.5-9B-modelscope}"
  tokenizer_path: "${QWEN35_9B_TOKENIZER_PATH:-/home/test/SKILLEV/skillev-new-b2-temp/tokenizer/Qwen3.5-9B}"
  backend: "sglang"
  api_base: "http://127.0.0.1:${FLOWSTEER_SUPERVISOR_PORT:-8015}/v1"
  served_model_name: "supervisor_theta"
  behavior_policy_version: "qwen35-9b-hotpot-step-000000"
  behavior_adapter_name: "theta_jointqa_progressive_step_000000"
  behavior_adapter_checkpoint: "artifacts/hotpotqa_multiagent_skill/policy_step_000000/theta"
  updated_policy_version: "qwen35-9b-jointqa-progressive-step-000001"
  expected_server_weight_version: "default"
  prompt_profile: "minimal"
  dtype: "bfloat16"
  max_context_tokens: 8192
  max_action_tokens: 1024
  temperature: 1.0
  top_p: 1.0
  top_k: -1
  max_rounds: 20
  execute_on_edit: true
  history_window: 4
  lora:
    enabled: true
    rank: 64
    alpha: 128
    dropout: 0.0
    target_modules: [q_proj, k_proj, v_proj, o_proj]

agent_graph:
  max_agents: 8
  max_agents_per_subgraph: 3
  contract_type: "free_text"
  relation_encoding: "two_bit"
  actions: [add_subgraph, modify_agent, delete_agent, set_relation, set_output, finish]
  executor_selection: "director_catalog_choice"
  max_bidirectional_block_size: 2
  require_unique_output: true
  require_all_agents_reach_output: true
  terminal_protocol_by_source:
    hotpotqa: "exact_single_answer_tag"
    triviaqa: "exact_single_answer_tag"
  model_catalog_path: "config/model_catalog_hotpotqa_deep_v6.yaml"

evaluation:
  healthbench_judge_model: ""
  max_environment_steps: 12
  swebench_harness_enabled: false
  invalid_evaluator_action: "persist_and_exclude"

grpo:
  enabled: true
  objective: "action_masked_one_pass"
  group_key: [task_id, condition_id, policy_version]
  samples_per_problem: 8
  expected_rollout_count: 16
  advantage_epsilon: 1.0e-8
  equal_weight_per_problem: true
  terminal_task_reward_only: true
  structural_reward: 0.0
  exploration_reward: 0.0
  skill_usage_reward: 0.0
  require_valid_evaluator: true
  invalid_evaluator_action: "persist_and_exclude"
  reject_forced_probes: true
  reject_fallback_or_manual_repair: true
  reject_reconstructed_context: true
  require_exact_behavior_receipt: true
  optimization_passes_per_rollout_batch: 1
  max_optimizer_updates: 1
  exact_optimizer_continuation: true
  learning_rate: 1.0e-5
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  max_grad_norm: 1.0

policy_sync:
  enabled: true
  api_base: "http://127.0.0.1:${FLOWSTEER_SUPERVISOR_PORT:-8015}"
  load_endpoint: "/load_lora_adapter"
  unload_endpoint: "/unload_lora_adapter"
  adapter_name_prefix: "theta_jointqa_progressive_step_"
  behavior_policy_version_required: true
  adapter_checkpoint_version_required: true
  request_timeout_seconds: 120
  max_retries: 3
  retry_backoff_seconds: 2
  fail_run_on_sync_error: true
  post_update_canary_count: 2
  canary:
    endpoint: "/generate"
    adapter_selector_field: "lora_path"
    require_explicit_adapter_name: true
    persist_full_trajectory: true

exploration:
  enabled: false
  strategy: "none"
  forced_probe_rollouts: 0

skills:
  enabled: true
  frozen_store: true
  store_path: "__REPLACE_AFTER_EVIDENCE_GATE__/skills.json"
  retrieval_top_k: 1
  current_epoch: 2
  library_version: "__REPLACE_WITH_ACTIVE_SKILL_LIBRARY_VERSION__"
  posterior_version: "__REPLACE_WITH_MATCHING_POSTERIOR_VERSION__"
  required_skill_ids:
    - "__REPLACE_WITH_HOTPOTQA_ACTIVE_SKILL_ID__"
    - "__REPLACE_WITH_TRIVIAQA_ACTIVE_SKILL_ID__"

gpu:
  learner_physical: 3
  rollout_physical: 4
  gradient_replica_physical: 5
  learner_device: "cuda:3"
  rollout_engine: "sglang"
  gradient_replica_device: "cuda:5"
  supervisor_gpu_id: 4
  supervisor_api_base: "http://127.0.0.1:8015/v1"
  training_enabled: true
  oom_policy:
    status: "active"
    micro_batch_size: 4
    minimum_micro_batch_size: 1
    micro_batch_schedule: [4, 2, 1]
    retry_on_cuda_oom: true
    split_items_across_learner_and_replica: true
    gradient_accumulation_steps: 1
    gradient_checkpointing: true

deployment:
  exploration_beta: 0.0
  allow_forced_probes: false
  active_skills_only: true
  require_version_compatible_skills: true
