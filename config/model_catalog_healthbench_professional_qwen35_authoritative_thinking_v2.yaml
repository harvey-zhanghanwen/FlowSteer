# HealthBench Professional retrieval-enabled Qwen3.5-9B catalog with the
# chat-template thinking mode enabled.  This is a new provider/profile
# identity so it cannot be confused with the frozen non-thinking v1 catalog.
providers:
  - provider_id: "local-qwen35-healthbench-authoritative-thinking-v2"
    kind: "openai-compatible"
    endpoint: "http://127.0.0.1:${FLOWSTEER_SUPERVISOR_PORT:-8015}/v1"
    max_concurrency: 8

models:
  - model_id: "qwen3.5-9b-local"
    provider_id: "local-qwen35-healthbench-authoritative-thinking-v2"
    model_name: "supervisor_theta"
    selection_weight: 1.0
    cheap_weight: 1.0
    fast_weight: 1.0
    context_window: 32768
    metadata:
      family: "qwen"
      profile: "provider=local;instruction=chat;thinking=enabled;capabilities=text,healthbench-authoritative-search;version=v2"
      text_capable: "true"
      tool_capable: "true"
      tool_capability_scope: "healthbench-authoritative.search"
      coding_capable: "false"
      chat_template_enable_thinking: "true"
      sampling_backend: "sglang"
      deployment_locality: "local"
      supports_top_k: "true"
      supports_repetition_penalty: "true"
      repetition_penalty: "1.05"
      max_tokens: "4096"
