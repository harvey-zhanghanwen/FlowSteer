# Frozen single-model catalog for the paired HealthBench Professional MedRAG
# condition.  Both the single-Agent ReAct arm and every free AgentGraph node
# use this exact local Qwen3.5-9B deployment.  Tool capability is restricted
# to the existing HealthBench MedRAG search Tool; this catalog does not add a
# provider, model alias, LoRA adapter, or training policy.
providers:
  - provider_id: "local-qwen35-healthbench-medrag"
    kind: "openai-compatible"
    endpoint: "http://127.0.0.1:${FLOWSTEER_SUPERVISOR_PORT:-8015}/v1"
    max_concurrency: 8

models:
  - model_id: "qwen3.5-9b-local"
    provider_id: "local-qwen35-healthbench-medrag"
    model_name: "supervisor_theta"
    selection_weight: 1.0
    cheap_weight: 1.0
    fast_weight: 1.0
    context_window: 32768
    metadata:
      family: "qwen"
      profile: "provider=local;instruction=chat;capabilities=text,healthbench-medrag-search"
      text_capable: "true"
      tool_capable: "true"
      tool_capability_scope: "healthbench-medrag.search"
      coding_capable: "false"
      chat_template_enable_thinking: "false"
      sampling_backend: "sglang"
      deployment_locality: "local"
      supports_top_k: "true"
      supports_repetition_penalty: "true"
      repetition_penalty: "1.05"
      max_tokens: "4096"
