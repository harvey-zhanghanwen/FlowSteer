  maximum_active_injected_per_step: 3
  newly_active_visible_from: "next_epoch"
  hard_gate_director_action: false
  reward_contribution: 0.0
  require_version_revalidation: true
  suspend_after_negative_mean_epochs: 2
  retire_after_suspended_epochs: 3

mace:
