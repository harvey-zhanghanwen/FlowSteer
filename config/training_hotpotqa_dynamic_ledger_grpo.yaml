    repeats_per_arm: 3
    same_snapshot: true
    exactly_one_decision_field_changed: true
    downstream_director_policy: "frozen_epoch_policy_resampled"
    randomized_branch_order: true
    isolate_cache_tool_state_and_random_seed_policy: true
    enters_grpo: false
    enters_standard_metrics: false
  audit:
    trigger: "latent_risk_warning"
    probability: 0.05
    repeats_per_arm: 3
    enters_grpo: false
    enters_standard_metrics: false

skills:
