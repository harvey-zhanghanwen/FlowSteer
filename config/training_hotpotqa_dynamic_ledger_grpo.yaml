  lora:
    enabled: true
    rank: 64
    alpha: 128
    dropout: 0.0
    target_modules: [q_proj, k_proj, v_proj, o_proj]

agent_graph:
  max_agents: 10
  contract_type: "free_text"
  relation_encoding: "two_bit"
  actions: [add_agent, modify_agent, delete_agent, set_relation, set_output, finish]
  executor_selection: "seeded_weighted_random"
  max_bidirectional_block_size: 2
  require_unique_output: true
  require_all_agents_reach_output: true
  model_catalog_path: "config/model_catalog.yaml"

evaluation:
  healthbench_judge_model: "gpt-4o-mini"
  max_environment_steps: 12
  invalid_evaluator_action: "persist_and_exclude"
  terminal_metrics: [exact_match, token_f1]

grpo:
  enabled: true
  objective: "action_masked_one_pass"
  ttb_enabled: false
  terminal_reward_field: "token_f1"
  group_key: [task_id, condition_id, policy_version]
  samples_per_problem: 4
  advantage_epsilon: 1.0e-8
  equal_weight_per_problem: true
  terminal_task_reward_only: true
  structural_reward: 0.0
  exploration_reward: 0.0
  skill_usage_reward: 0.0
  latent_loss_reward: 0.0
  probe_reward: 0.0
  require_valid_evaluator: true
  invalid_evaluator_action: "persist_and_exclude"
  reject_forced_probes: true
  reject_audits: true
  reject_fallback_or_manual_repair: true
  reject_reconstructed_context: true
  require_exact_behavior_receipt: true
  optimization_passes_per_rollout_batch: 1
  max_optimizer_updates_per_step: 1
  learning_rate: 1.0e-4
  weight_decay: 0.01
  scheduler: "cosine_with_warmup"
  warmup_steps: 0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  max_grad_norm: 3.0

dynamic_ledger:
  enabled: true
  role: "director_observation_and_exploration_plane"
  differentiable: false
  contributes_to_grpo_reward: false
  terminal_binary_outcome: "exact_match"
  comparison_fit_source: "same_snapshot_paired_probes_only"
  absolute_baseline_sources: [natural_trajectory, probe_branch, audit_branch]
  sensor_sources: [natural_trajectory, probe_branch, audit_branch]
  decision_key:
    task_family: "dataset_family_or_frozen_question_embedding_cluster"
    role_clusters: [solve, verify, plan, summarize, arbitrate, retrieve, code, test]
    role_assignment: "llm_strict_json"
    keyword_fallback_allowed: false
    model_id: "stable_model_catalog_version_id"
    edge_types: [independent, unidirectional, bidirectional]
    same_model_as_upstream: [false, true]
    stages: [before_output, other]
  posterior:
    family: "gaussian_conjugate"
    one_hot_factors: [role, model, relation]
    cholesky_solve: true
    prior_variance_initial: 0.05
    interaction_prior_variance_initial: 0.05
    interaction_activation_probes: 5
    empirical_bayes_once_per_epoch: true
    noise_variance_floor: 0.01
    task_baseline_prior_mean: 0.5
    task_baseline_prior_count: 4
    expected_terminal_clip: [0.02, 0.98]
    sensor_prior: "Beta(1,1)"
  latent_risk:
    tau: 0.8
    delta_min: 0.05
    candidate_top_k: 5
    posterior_samples: 200
    pre_execution_cost: 0.0
    post_revision_cost: 0.05
    suppress_warning_when_remaining_rounds_lte: 1
    director_action_space_unchanged: true
  policy_refresh:
    normal_decay: 0.1
    low_coverage_decay: 0.5
    sensor_count_multiplier: 0.9
    task_baseline_epochs_retained: 2
    reset_after_consecutive_low_coverage_epochs: 2

role_classification:
  enabled: true
  method: "llm"
  response_format: "strict_json"
  allowed_role_clusters: [solve, verify, plan, summarize, arbitrate, retrieve, code, test]
  keyword_or_regex_fallback_allowed: false
  receipt_required: true
  role_intervention_contract_rewrite: "llm_semantic_preserving"

exploration:
  enabled: true
  method: "dynamic_combination_posterior"
  legacy_mace_enabled: false
  legacy_joint_bayesian_enabled: false
  legacy_particle_evsi_enabled: false
  probe:
