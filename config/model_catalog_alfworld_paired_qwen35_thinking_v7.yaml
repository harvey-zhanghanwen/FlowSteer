# ALFWorld v23 Qwen3.5-9B strict-thinking catalog. Every Agent uses the same
# local model; complex ALFWorld Tool-Agent reasoning phases use 768 tokens and
# simple phases use the catalog default 512-token thinking budget.
providers:
  - provider_id: "local-director"
    kind: "openai-compatible"
    endpoint: "http://127.0.0.1:${FLOWSTEER_SUPERVISOR_PORT:-8015}/v1"
    max_concurrency: 8

models:
  - model_id: "qwen3.5-9b-local"
    provider_id: "local-director"
    model_name: "supervisor_theta"
    selection_weight: 1.0
    cheap_weight: 1.0
    fast_weight: 1.0
    context_window: 32768
    metadata:
      family: "qwen"
      profile: "provider=local-director;locality=local;instruction=chat;reasoning=qwen3.5-thinking;context=32768;capabilities=text,structured-action"
      capability_canary: "pending_alfworld_thinking_v23"
      text_capable: "true"
      tool_capable: "true"
      tool_capability_scope: "flowsteer-structured-action"
      chat_template_enable_thinking: "true"
      chat_template_thinking_budget: "512"
      server_reasoning_mode: "strict-thinking"
      sampling_backend: "sglang"
      deployment_locality: "local"
      supports_top_k: "true"
      max_tokens: "4096"
