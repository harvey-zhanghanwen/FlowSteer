# Optional, unvalidated Director priors; existing SkillFlow-derived candidate wire.
# No medical facts, fixed roles/topology, training or ACTIVE publication.
schema_version: flowsteer.healthbench-candidate-skill-profile.v1
profile_version: healthbench.orchestration-candidates.v2.45
dataset_key: healthbench_professional
status: candidate
training_enabled: false
skill_publication_enabled: false
candidates:
  - condition_id: resolve_entity_before_explanation_v245
    status: candidate
    condition:
      task_family: healthbench_professional
      graph_stage: '*'
      required_tools: []
    trigger: >-
      Planning work about an unresolved name or factual premise.
    action:
      instruction: >-
        Keep the contract short: identify the entity from the original wording
        and a matching source before explaining it. Match an allowed search
        resource to the information need. Do not put a guessed identity,
        population or conclusion in the contract. Ask for source identifiers,
        relevant findings and unresolved alternatives. A related hit is not
        identification; no hit is not proof of absence.
  - condition_id: use_first_admitted_execution_repair_v245
    status: candidate
    condition:
      task_family: healthbench_professional
      graph_stage: '*'
      required_tools: []
    trigger: >-
      One failed invocation already contains repeated parsing or action-protocol errors.
    action:
      instruction: >-
        At the first legal MODIFY opportunity, consider a different admitted
        model for that same node; do not spend the opportunity expanding its
        task prose. Change one admitted field or coupled execution profile
        per action. Preserve and check available receipts. Use a tool-free
        reasoning profile only when the node already has sufficient evidence;
        unresolved retrieval still needs a tool-capable profile. If MODIFY is
        unavailable, any new repair unit must be legal and executable without
        waiting on the failed prerequisite. Do not add blocked consumers or
        repeat searches merely to reset a recovery counter.
  - condition_id: synthesize_from_evidence_without_redundant_react_v245
    status: candidate
    condition:
      task_family: healthbench_professional
      graph_stage: '*'
      required_tools: []
    trigger: >-
      Choosing execution mode or final routing for an Agent with existing evidence.
    action:
      instruction: >-
        When synthesis needs no new Tool observation, consider reasoning mode
        with the actual routed evidence instead of another ReAct search loop.
        Require source-grounded claims, contradictions and uncertainty, not
        agreement with upstream conclusions. If evidence is missing, keep that
        gap explicit and use a legal retrieval or checking unit only as needed.
        Preserve required branches and original scope. FINISH when the response
        addresses the task and the live action is admissible.
