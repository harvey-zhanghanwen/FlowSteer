# Frozen local-only executor catalog for the first TriviaQA architecture round.
# The Flow-Director and every Agent use the same task-owned Qwen3.5-9B server;
# no remote provider arm or unverified model alias is present in this condition.

providers:
  - provider_id: "local-qwen35"
    kind: "openai-compatible"
    endpoint: "http://127.0.0.1:${FLOWSTEER_SUPERVISOR_PORT:-8015}/v1"
    max_concurrency: 8

models:
  - model_id: "qwen3.5-9b-local"
    provider_id: "local-qwen35"
    model_name: "supervisor_theta"
    selection_weight: 1.0
    cheap_weight: 1.0
    fast_weight: 1.0
    context_window: 8192
    metadata:
      family: "qwen"
      profile: "text_qa;provider=local-qwen35;locality=local;reasoning=general;context=8192;instruction=chat;concise=exact-tag"
      chat_template_enable_thinking: "false"
      max_tokens: "2048"
