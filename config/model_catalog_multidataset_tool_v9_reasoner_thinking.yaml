# Qwen3.5 Reasoner-only thinking catalog for unified_architecture_v2.
# The v7 all-semantic-thinking and v8 bounded all-semantic-thinking catalogs
# remain immutable because trajectory receipts are bound to them.
# The exact previously probed MiniMax-M2.5 model ID returned an HTTP 403
# permanent-configuration receipt in r43, so the frozen r44 catalog retains
# only the available local Qwen3.5-9B Executor. No guessed provider alias or
# unprobed replacement model is introduced.
providers:
  - provider_id: "local-director"
    kind: "openai-compatible"
    endpoint: "http://127.0.0.1:8015/v1"
    max_concurrency: 32

models:
  - model_id: "qwen3.5-9b-local"
    provider_id: "local-director"
    model_name: "supervisor_theta"
    selection_weight: 1.0
    cheap_weight: 1.0
    fast_weight: 1.0
    context_window: 32768
    metadata:
      family: "qwen"
      profile: "provider=local-director;locality=local;instruction=chat;reasoning=reasoner-only-qwen3.5-chat-template-thinking;context=32768;capabilities=text,structured-action,coding-format"
      capability_canary: "reasoner_only_thinking_runtime_verified_2026-08-30"
      canary_source: "live_receipt_canary_for_reasoner_only_thinking_profile"
      text_capable: "true"
      tool_capable: "true"
      tool_capability_scope: "flowsteer-structured-action"
      coding_capable: "true"
      coding_capability_scope: "structured-action-and-unified-diff-format"
      chat_template_enable_thinking: "false"
      chat_template_enable_thinking_reasoner: "true"
      chat_template_thinking_budget_reasoner: "512"
      chat_template_enable_thinking_verifier: "false"
      chat_template_enable_thinking_format: "false"
      sampling_backend: "sglang"
      deployment_locality: "local"
      supports_top_k: "true"
      max_tokens: "8192"
