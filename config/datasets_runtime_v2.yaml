# Future-only runtime dataset registry for the seven AgentGraph benchmarks.
#
# Existing evaluation configurations and persisted selections predate this
# registry and remain immutable.  A new condition opts in only by declaring
# both data.registry_path and data.registry_dataset_key.  The completion
# runner then verifies its explicit split paths against this registry before
# selecting any task.

schema_version: "flowsteer.agentgraph.runtime-datasets.v2"
task_schema_version: "flowsteer.agentgraph.task.v1"

datasets:
  hotpotqa:
    protocol_label: "joint_qa_partitioned_v2"
    preparation_catalog_path: "config/joint_qa_partitions_v2.yaml"
    preparation_catalog_schema_version: "flowsteer.joint-qa.partitions.v2"
    manifest:
      path: "data/joint_qa_v2/manifest.json"
      schema_version: "flowsteer.joint-qa.partitions.v2"
      provenance_field: "config"
    manifest_partition_keys:
      train: "train"
      validation: "development"
      test: "test"
    paths:
      train: "data/joint_qa_v2/train.jsonl"
      validation: "data/joint_qa_v2/development.jsonl"
      test: "data/joint_qa_v2/test.jsonl"

  triviaqa:
    protocol_label: "joint_qa_partitioned_v2"
