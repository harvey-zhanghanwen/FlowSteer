# Candidate orchestration advice only; no medical answers or learned status.
schema_version: flowsteer.healthbench-candidate-skill-profile.v1
profile_version: healthbench.orchestration-candidates.v2.48
dataset_key: healthbench_professional
status: candidate
training_enabled: false
skill_publication_enabled: false
candidates:
  - condition_id: preserve_identity_and_task_scope_v248
    status: candidate
    condition:
      task_family: healthbench_professional
      graph_stage: '*'
      required_tools: []
    trigger: An entity, source or factual premise is unresolved when assigning work.
    action:
      instruction: >-
        Assign identification only for the unresolved part of the task. Preserve
        the original entity, population and identifier namespace; a publisher
        identifier is not a different database's identifier. Investigate with
        concise terms, then distinguish a matched source from a related hit.
        Do not prefill diagnoses, numerical definitions or conclusions in a
        contract. If a source is unavailable, consider an alternative admitted
        source while preserving the original question; do not change identity.
  - condition_id: repair_arguments_without_abandoning_react_v248
    status: candidate
    condition:
      task_family: healthbench_professional
      graph_stage: '*'
      required_tools: []
    trigger: Actual feedback reports parsing, query, source-binding or execution errors.
    action:
      instruction: >-
        Keep ReAct. Repair the named field against the actual Tool schema,
        using a short query or exact observed source identifiers and excerpts.
        Copy a contiguous quote without changing its punctuation or OCR text;
        report any unresolved evidence limitation explicitly rather than submitting
        an empty uncertainty field.
        Retain successful receipts and do not repeat a rejected query across
        Tools with the same limit. At a legal repair opportunity consider a
        different compatible model for the same responsibility. Repair the
        execution problem, not by prescribing a medical conclusion. Respect
        the existing turn, Tool and model-repair budgets.
  - condition_id: separate_evidence_gaps_from_response_coverage_v248
    status: candidate
    condition:
      task_family: healthbench_professional
      graph_stage: '*'
      required_tools: []
    trigger: Routing evidence or deciding whether the Output answers the whole conversation.
    action:
      instruction: >-
        Give each contract a concrete deliverable and actual input dependency.
        Separate retrieval status, evidence, inference and uncertainty. Prior
        conversation is context, not a newly verified source. An unavailable
        source does not establish nonexistence or justify replacing the whole
        response with an access report. Before FINISH, compare actual Output
        with all explicitly requested deliverables. Preserve supported content;
        repair a missing part or assign a focused interpretation or completion
        check where useful, then reconcile findings. Roles, number, models and
        topology stay free; no extra FINISH gate. Avoid repeated summaries and
        unsupported certainty. Keep ReAct; complete without another Tool call
        when received evidence is sufficient.
