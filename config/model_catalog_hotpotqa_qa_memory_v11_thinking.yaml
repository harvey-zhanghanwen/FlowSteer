# Versioned future-only catalog derived from v10.  The only decoding change is
# Qwen3.5 native thinking mode for free-text reasoning/output worker requests.
# Strict-schema ReAct actions remain non-thinking because Qwen3.5 otherwise
# exhausts the completion in reasoning_content without emitting action JSON.
# The v10 catalog and the completed v22 receipts remain immutable.
providers:
  - provider_id: "local-director"
    kind: "openai-compatible"
    endpoint: "http://127.0.0.1:${FLOWSTEER_SUPERVISOR_PORT:-8015}/v1"
    max_concurrency: 1
    api_key_env: "SGLANG_API_KEY"

models:
  - model_id: "qwen3.5-9b-local"
    provider_id: "local-director"
    model_name: "supervisor_theta"
    selection_weight: 10.0
    cheap_weight: 10.0
    fast_weight: 9.0
    context_window: 8192
    metadata:
      chat_template_enable_thinking: "true"
      chat_template_thinking_budget: "512"
      max_tokens: "4608"
      sampling_backend: "sglang"
      deployment_locality: "local"
      supports_top_k: "true"
