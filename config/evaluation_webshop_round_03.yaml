# Fixed held-out WebShop success-rate evaluation.  This uses the architecture
# and protocol selected on the disjoint development tasks.

schema_version: "flowsteer.agentgraph.config.v1"
experiment:
  name: "webshop_evaluation_round_03"
  phase: "webshop_evaluation"
  training_enabled: false
  seed: 20260819
  condition_id: "webshop_evaluation_skill_off_v3"
  sampling_schedule_purpose: "webshop_fixed_heldout_evaluation_v3"
  catalog_order_namespace: "webshop_round_03"
  prompt_version: "agentgraph.director.progressive_subgraph.v1"
  tool_version: "agentgraph.add-subgraph+skillflow-ragen-webshop.v3"
  output_dir: "artifacts/webshop_round_03/evaluation"

data:
  catalog_path: "config/datasets_webshop.yaml"
  train_path: "data/webshop_v2/train.jsonl"
  validation_path: "data/webshop_v2/validation.jsonl"
  test_path: "data/webshop_v2/test.jsonl"
  enforce_split_isolation: true
  task_schema_version: "flowsteer.agentgraph.task.v1"

webshop_evaluation:
  dataset_key: "webshop"
  stage: "evaluation"
  split: "validation"
  selection: "sequential"
  sample_count: 128
  stable_zero_sample_count: 2
  rollouts_per_task: 1
  concurrency: 2
  direct_model_id: "qwen3.5-9b-local"
  direct_protocol: "skillflow_ragen_webshop_react_v1"
  direct_contract: "Return exactly one executable WebShop action permitted by the current admissible-action list."
  direct_generation_seed: 20260819

storage:
  schema_version: "flowsteer.webshop.round.v3"
  root: "artifacts/webshop_round_03/evaluation/evidence"
  selected_tasks_path: "artifacts/webshop_round_03/evaluation/selected_tasks.jsonl"
  direct_predictions_path: "artifacts/webshop_round_03/evaluation/direct_predictions.jsonl"
  trajectories_path: "artifacts/webshop_round_03/evaluation/agentgraph_trajectories.jsonl"
  failures_path: "artifacts/webshop_round_03/evaluation/collection_failures.jsonl"
  paired_results_path: "artifacts/webshop_round_03/evaluation/paired_results.jsonl"
  wrong_demos_path: "artifacts/webshop_round_03/evaluation/wrong_demos.jsonl"
  manifest_path: "artifacts/webshop_round_03/evaluation/run_manifest.json"
  preflight_receipt_path: "artifacts/webshop_round_03/evaluation/preflight_receipt.json"
  report_json_path: "reports/webshop_round_03/evaluation_report.json"
  report_markdown_path: "reports/webshop_round_03/evaluation_report.md"

director:
  base_model: "${QWEN35_9B_MODEL_PATH:-/home/test/SKILLEV/skillev-new-b2-temp/model/Qwen3.5-9B-modelscope}"
  tokenizer_path: "${QWEN35_9B_TOKENIZER_PATH:-/home/test/SKILLEV/skillev-new-b2-temp/tokenizer/Qwen3.5-9B}"
  backend: "sglang"
  api_base: "http://127.0.0.1:${FLOWSTEER_SUPERVISOR_PORT:-8015}/v1"
  served_model_name: "supervisor_theta"
  behavior_policy_version: "qwen35-9b-webshop-round-03-step-000000"
  behavior_adapter_name: "theta_jointqa_progressive_step_000000"
  behavior_adapter_checkpoint: "artifacts/hotpotqa_multiagent_skill/policy_step_000000/theta"
  updated_policy_version: "unused-evaluation-only"
  expected_server_weight_version: "default"
  prompt_profile: "minimal"
  dtype: "bfloat16"
  max_context_tokens: 8192
  max_action_tokens: 1024
  temperature: 1.0
  top_p: 1.0
  top_k: -1
  max_rounds: 20
  execute_on_edit: true
  history_window: 4
  lora:
    enabled: true
    rank: 64
    alpha: 128
    dropout: 0.0
    target_modules: [q_proj, k_proj, v_proj, o_proj]

agent_graph:
  max_agents: 8
  max_agents_per_subgraph: 3
  contract_type: "free_text"
  relation_encoding: "two_bit"
  actions: [add_subgraph, modify_agent, delete_agent, set_relation, set_output, finish]
  executor_selection: "director_catalog_choice"
  max_bidirectional_block_size: 2
  require_unique_output: true
  require_all_agents_reach_output: true
  terminal_protocol_by_source:
    webshop: "none"
  model_catalog_path: "config/model_catalog_hotpotqa_deep_v6.yaml"

evaluation:
  healthbench_judge_model: ""
  max_environment_steps: 10
  max_environment_steps_by_source:
    webshop: 10
  swebench_harness_enabled: false
  invalid_evaluator_action: "persist_and_exclude"

grpo:
  enabled: false
  objective: "action_masked_one_pass"
  group_key: [task_id, condition_id, policy_version]
  samples_per_problem: 1
  advantage_epsilon: 1.0e-8
  equal_weight_per_problem: true
  terminal_task_reward_only: true
  structural_reward: 0.0
  exploration_reward: 0.0
  skill_usage_reward: 0.0
  require_valid_evaluator: true
  reject_forced_probes: true
  reject_fallback_or_manual_repair: true
  reject_reconstructed_context: true
  require_exact_behavior_receipt: true
  optimization_passes_per_rollout_batch: 0
  max_optimizer_updates: 0
  learning_rate: 0.0
  gradient_checkpointing: false
  max_grad_norm: 0.0

policy_sync:
  enabled: false
  api_base: "http://127.0.0.1:${FLOWSTEER_SUPERVISOR_PORT:-8015}"
  adapter_name_prefix: "theta_webshop_unused_"
  request_timeout_seconds: 120
  max_retries: 0
  retry_backoff_seconds: 1

exploration:
  enabled: false
  strategy: "none"
  forced_probe_rollouts: 0

skills:
  enabled: false
  initial_library: []
  retrieval_top_k: 0
  library_version: "none"

gpu:
  learner_physical: 3
  rollout_physical: 4
  gradient_replica_physical: 5
  learner_device: "cuda:3"
  rollout_engine: "sglang"
  gradient_replica_device: "cuda:5"
  supervisor_gpu_id: 4
  supervisor_api_base: "http://127.0.0.1:8015/v1"
  training_enabled: false
  oom_policy:
    status: "inactive_evaluation_only"
    micro_batch_size: 1
    minimum_micro_batch_size: 1
    micro_batch_schedule: [1]
    retry_on_cuda_oom: false
    split_items_across_learner_and_replica: false
    gradient_accumulation_steps: 1
    gradient_checkpointing: false

deployment:
  exploration_beta: 0.0
  allow_forced_probes: false
  active_skills_only: false
  require_version_compatible_skills: true
