# Clinical-reference candidate; model capability receipts reused from v2.35. DeepSeek and MiniMax passed the
# real two-step ReAct calculator canary; Qwen Flash repeated its Tool action and
# remains reasoning-only. All four retain their existing thinking configuration.
providers:
  - provider_id: "local-qwen35-healthbench-authoritative-thinking-v2"
    kind: "openai-compatible"
    endpoint: "http://127.0.0.1:${FLOWSTEER_SUPERVISOR_PORT:-8015}/v1"
    max_concurrency: 8

  - provider_id: "vectorengine-healthbench-mixed-thinking-v1"
    kind: "openai-compatible"
    endpoint: "${VECTOR_ENGINE_BASE_URL:-https://api.vectorengine.ai/v1}"
    max_concurrency: 8
    api_key_env: "VECTOR_ENGINE_API_KEY"

models:
  - model_id: "qwen3.5-9b-local"
    provider_id: "local-qwen35-healthbench-authoritative-thinking-v2"
    model_name: "supervisor_theta"
    selection_weight: 1.0
    cheap_weight: 1.0
    fast_weight: 1.0
    context_window: 32768
    metadata:
      family: "qwen"
      healthbench_execution_protocol: "contract-is-not-evidence.output-complete.slot-binding.closure.v5"
      profile: "provider=local;instruction=chat;thinking=enabled;capabilities=text,healthbench-authoritative-search;version=healthbench-v2"
      text_capable: "true"
      tool_capable: "true"
      tool_capability_scope: "healthbench-authoritative.search,healthbench-medrag.search,healthbench-source.read,healthbench-drug.lookup,healthbench-computation.calculator,healthbench-knowledge.search,healthbench-literature.search,healthbench-trials.search,healthbench-bookshelf.search,healthbench-pdq.search,healthbench-ahrq.search,healthbench-terminology.search"
      coding_capable: "false"
      chat_template_enable_thinking: "true"
      max_tokens: "4096"
      thinking_budget: "4096"
      sampling_backend: "sglang"
      deployment_locality: "local"
      supports_top_k: "true"
      top_k: "-1"
      supports_repetition_penalty: "true"
      repetition_penalty: "1.10"

  - model_id: "qwen3.5-flash"
    provider_id: "vectorengine-healthbench-mixed-thinking-v1"
    model_name: "qwen3.5-flash"
    selection_weight: 1.0
    cheap_weight: 1.0
    fast_weight: 1.0
    metadata:
      family: "qwen"
      healthbench_execution_protocol: "contract-is-not-evidence.output-complete.slot-binding.closure.v5"
      profile: "provider=vectorengine;locality=remote;instruction=chat;reasoning=provider-thinking;capabilities=text;availability=current-list-and-thinking-canary"
      capability_canary: "thinking_passed.react_completion_repeated_2026-09-06"
      canary_source: "reports/healthbench_professional_optional_clinical_tools_v2_35/tool_compatibility_receipts.json"
      text_capable: "true"
      tool_capable: "false"
      coding_capable: "false"
      chat_template_enable_thinking: "true"
      max_tokens: "8192"

  - model_id: "deepseek-v4-flash"
    provider_id: "vectorengine-healthbench-mixed-thinking-v1"
    model_name: "deepseek-v4-flash"
    selection_weight: 1.0
    cheap_weight: 1.0
    fast_weight: 1.0
    metadata:
      family: "deepseek"
      healthbench_execution_protocol: "contract-is-not-evidence.output-complete.slot-binding.closure.v5"
      profile: "provider=vectorengine;locality=remote;instruction=chat;reasoning=provider-thinking;capabilities=text;availability=current-list-and-thinking-canary"
      capability_canary: "passed_thinking_react_calculator_2026-09-06"
      canary_source: "reports/healthbench_professional_optional_clinical_tools_v2_35/tool_compatibility_receipts.json"
      text_capable: "true"
      tool_capable: "true"
      tool_capability_scope: "healthbench-authoritative.search,healthbench-medrag.search,healthbench-source.read,healthbench-drug.lookup,healthbench-computation.calculator,healthbench-knowledge.search,healthbench-literature.search,healthbench-trials.search,healthbench-bookshelf.search,healthbench-pdq.search,healthbench-ahrq.search,healthbench-terminology.search"
      coding_capable: "false"
      chat_template_enable_thinking: "true"
      max_tokens: "8192"

  - model_id: "MiniMax-M3"
    provider_id: "vectorengine-healthbench-mixed-thinking-v1"
    model_name: "MiniMax-M3"
    selection_weight: 1.0
    cheap_weight: 1.0
    fast_weight: 1.0
    metadata:
      family: "minimax"
      healthbench_execution_protocol: "contract-is-not-evidence.output-complete.slot-binding.closure.v5"
      profile: "provider=vectorengine;locality=remote;instruction=chat;reasoning=provider-thinking;capabilities=text;availability=current-list-and-thinking-canary"
      capability_canary: "passed_thinking_react_calculator_2026-09-06"
      canary_source: "reports/healthbench_professional_optional_clinical_tools_v2_35/tool_compatibility_receipts.json"
      text_capable: "true"
      tool_capable: "true"
      tool_capability_scope: "healthbench-authoritative.search,healthbench-medrag.search,healthbench-source.read,healthbench-drug.lookup,healthbench-computation.calculator,healthbench-knowledge.search,healthbench-literature.search,healthbench-trials.search,healthbench-bookshelf.search,healthbench-pdq.search,healthbench-ahrq.search,healthbench-terminology.search"
      coding_capable: "false"
      chat_template_enable_thinking: "true"
      max_tokens: "8192"
