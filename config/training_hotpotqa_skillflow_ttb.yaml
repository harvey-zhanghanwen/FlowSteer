# Method-decision and launch gate for HotpotQA training.
# This file is deliberately non-runnable.  FlowSteer/MD one-pass GRPO and
# SkillFlow TTB are alternative primary objectives; neither is selected until
# the user resolves the documented conflict.

schema_version: "flowsteer.dual_source_training.preflight.v2"

run_identity:
  dataset: "hotpotqa"
  source_backup_branch: "backup/hotpotqa-compliant-best-round01-20260906"
  source_backup_commit: "740e53ec6ccac635ecbe7f1f379b002bfb2574d1"
  status: "blocked_method_selection"
  training_enabled: false
  optimizer_steps_completed: 0

scope_and_comparability:
  scope: "single_dataset_project_adaptation"
  bit_exact_skillflow_reproduction: false
  skillflow_main_scope: "seven_IID_tasks_joint_training"
  note: "Training HotpotQA separately is a project adaptation; SkillFlow.pdf does not include MBPP++."

source_revisions:
  flowsteer_paper_aligned_code:
    repository: "https://github.com/beita6969/FlowSteer"
    revision: "a329b577a8e8c2f2d5492983b492473a06a8e718"
  skillflow_original_code:
    repository: "https://github.com/beita6969/SkillFlow"
    revision: "74be52bb6bd9f0e9e68dacb72636b75649197983"
    local_checkout: "/ssd1/iclr/owner/skillflow-iclr/06_GITHUB_RELEASE_20260816"
  project_agentgraph_backup:
    revision: "740e53ec6ccac635ecbe7f1f379b002bfb2574d1"

method_and_conflict_resolution:
  decision_status: "awaiting_user_decision"
  primary: null
  paper_formal_name: "Tempered Trajectory Balance (TTB)"
  user_transcription_alias: "Trajectory Token Balance"
  grpo:
    enabled: false
    role: "primary_candidate_from_flowsteer_and_project_md"
    implementation: "action_masked_one_pass_group_policy_gradient"
  ttb:
    enabled: false
    role: "primary_candidate_from_skillflow"
    implementation: "tempered_trajectory_balance"
  conflict: "The project MD specifies Action-Masked One-Pass GRPO for task learning, while SkillFlow uses Tempered Trajectory Balance regression as its primary objective. These are different objectives and cannot be combined or substituted silently."
  resolution: null
  allowed_resolutions:
    - "select_flowsteer_md_one_pass_grpo"
    - "select_skillflow_ttb_as_explicit_project_adaptation"
    - "run_two_isolated_versioned_experiments_without_mixing_losses"
  score_only: "structured_action_tokens"
  reasoning_tokens: "context_only_zero_loss_mask"
  edge_log_probability: "mean_over_action_tokens"
  residual: "log_Z_theta(question) + sum(log_P_theta_edge_mean) - beta*log(reward+epsilon_min) - sum(log_P_phi_edge_mean)"
  loss: "square(residual / action_edge_count)"
  rollout_policy: "current_theta_on_policy"
  executor: "frozen"
  terminal_reward:
    primary: null
    candidates: [official_exact_match, token_f1]
    source_conflict: "SkillFlow.pdf describes EM for multi-hop QA, while the original release maps multi_hop_qa to token F1. The scalar TTB reward remains undecided."

paper_hyperparameters:
  optimizer_steps: 250
  effective_batch_size: 28
  questions_per_step: 7
  trajectories_per_question: 4
  max_trajectory_steps: 12
  beta: 1.0
  epsilon_min: 0.1
  kl_coefficient: 0.01
  optimizer: "AdamW"
  learning_rate: 1.0e-4
  max_gradient_norm: 3.0
  checkpoint_every_steps: 10
  theta_lora:
    rank: 64
    alpha: 128
    target_modules: [q_proj, k_proj, v_proj, o_proj]
  phi_lora:
    selected_rank: 16
    alpha: 32
    target_modules: [q_proj, v_proj]
  partition_function:
    trainable: true
    separate_optimizer_parameters: true
  joint_updates: [theta, partition_function_Z, phi]

paper_ambiguities:
  phi_lora_rank:
    main_table: 16
    appendix_variant: 32
    selected: 16
    selection_reason: "Use the paper main-run table; preserve the appendix discrepancy explicitly."

paper_hardware:
  hardware: "4x NVIDIA A100 80GB"
  reported_peak_memory_per_gpu: "approximately 70GB"
  tensor_parallel_layout: "not_specified_by_paper"
  data_parallel_layout: "not_specified_by_paper"
  zero_stage: "not_specified_by_paper"
  rollout_worker_count: "not_specified_by_paper"
  sampling_parameters: "not_specified_by_paper"
  gpu_role_mapping: "not_specified_by_paper"

project_adaptations:
  runtime: "FlowSteer AgentGraph/Canvas/evaluator/exact trajectory receipts"
  dataset_scope: "HotpotQA-only"
  weight_publication: "versioned theta LoRA publish, route switch, and canary"
  staleness_policy: "zero; next rollout is admitted only after successful publication and canary"
  provenance_note: "Publication barrier, atomic route handling, staleness policy, W&B extensions, and resolved GPU mapping are project engineering, not statements from SkillFlow.pdf."

source_map:
  detailed_report: "docs/FLOWSTEER_SKILLFLOW_TRAINING_SOURCE_MAP.md"
  flowsteer_revision: "a329b577a8e8c2f2d5492983b492473a06a8e718"
  skillflow_revision: "74be52bb6bd9f0e9e68dacb72636b75649197983"
  skillflow_root: "/ssd1/iclr/owner/skillflow-iclr/06_GITHUB_RELEASE_20260816"
  trajectory_contract: "training/trajectory.py"
  edge_normalization: "training/flow_metrics.py::edge_logprob_tilde"
  theta_phi_Z_and_TTB_backward: "training/gflownet_trainer.py::_gradient_accumulation_step"
  backward_policy: "training/backward_policy.py::BackwardPolicy"
  optimizer_setup: "training/gflownet_trainer.py::_setup_optimizers"
  lora_transport_only: "training/gflownet_trainer.py::_sync_lora_to_vllm"
  flowsteer_runtime: "src/interactive/agent_runtime.py"
  flowsteer_trajectory: "src/interactive/records.py"
  flowsteer_policy_publication: "src/interactive/policy_sync.py"

resource_admission:
  required_before_launch: true
  host_gpu_snapshot_observed: false
  resolved_gpu_plan: null
  status: "resource_blocked"
  rule: "Do not launch until host-side memory, utilization, and process ownership prove a non-conflicting plan."

wandb_contract:
  mode: "online"
  fail_closed: true
  api_key_configured: false
  package_available_in_selected_training_env: false
  required_step_fields:
    - optimizer_step
    - behavior_policy_version
    - theta_version
    - phi_version
    - partition_function_version
    - adapter_version
    - ttb_loss
    - ttb_delta_squared
    - reward
    - trajectory_length
    - valid_rollouts
    - filtered_rollouts
    - filter_reasons
    - rollout_latency
    - backward_latency
    - sync_latency
    - rollouts_per_second
    - tokens_per_second
    - gpu_memory
    - gpu_utilization
    - error_counts
    - theta_gradient_norm
    - phi_gradient_norm
    - partition_function_gradient_norm
    - theta_update_l2
    - phi_update_l2
    - partition_function_update_l2
    - checkpoint
    - publish_status
    - canary_status
    - skill_phase_event

closure_gate:
  required_real_optimizer_steps: 1
  passed: false
  require_single_behavior_policy_per_batch: true
  require_rollout_batch_consumed_once: true
  require_nonzero_gradients: [theta, partition_function_Z, phi]
  require_nonzero_parameter_updates: [theta, partition_function_Z, phi]
  require_new_theta_in_next_step_receipts: true
  require_post_update_rollout_before_long_run: true
  require_publish_and_canary: true

wiring_status:
  flowsteer_agentgraph_runtime: "implemented"
  flowsteer_exact_trajectory_receipts: "implemented"
  skillflow_ttb_action_token_adapter: "not_implemented"
  theta_phi_Z_joint_training_on_agentgraph_trajectory: "not_implemented"
  formal_TTB_checkpoint_resume: "not_implemented"
  real_two_step_closure: "not_run"
  mace: "present_unwired"
  joint_bayesian_posterior: "present_unwired"
  evsi: "present_unwired"
  paired_intervention: "present_unwired"
  automatic_skill_publication: "present_unwired"
  skill_phase_status: "disabled_not_integrated"

actual_status:
  launch_allowed: false
  optimizer_steps_completed: 0
  wandb_run: null
  convergence_claim: null
  blocked_by:
    - "primary_objective_not_selected"
    - "ttb_reward_scalar_not_selected_if_ttb_is_chosen"
    - "resource_admission_unresolved"
    - "wandb_online_preflight_unresolved"
