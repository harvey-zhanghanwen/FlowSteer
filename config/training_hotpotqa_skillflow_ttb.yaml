  decision_status: "selected"
  primary: "action_masked_one_pass_grpo"
  paper_formal_name: "Tempered Trajectory Balance (TTB)"
  grpo:
    enabled: true
    role: "primary_task_learning_objective"
    implementation: "action_masked_one_pass_group_policy_gradient"
