disabled_ttb_reference_hyperparameters:
  optimizer_steps: 250
  effective_batch_size: 28
  questions_per_step: 7
  trajectories_per_question: 4
  max_trajectory_steps: 12
  beta: 1.0
  epsilon_min: 0.1
  kl_coefficient: 0.01
  optimizer: "AdamW"
  learning_rate: 1.0e-4
  max_gradient_norm: 3.0
  checkpoint_every_steps: 10
  theta_lora:
    rank: 64
    alpha: 128
    target_modules: [q_proj, k_proj, v_proj, o_proj]
  phi_lora:
    selected_rank: 16
    alpha: 32
    target_modules: [q_proj, v_proj]
  partition_function:
    trainable: true
    separate_optimizer_parameters: true
  joint_updates: [theta, partition_function_Z, phi]

disabled_ttb_reference_ambiguities:
