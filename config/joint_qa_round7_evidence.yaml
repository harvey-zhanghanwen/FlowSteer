    start: 60
    stop: 63
    zero_based_stop_exclusive: true
    task_ids:
      hotpotqa:
        - "hotpotqa:5adf698f5542993a75d264e2"
        - "hotpotqa:5a8e506d5542990e94052ac8"
        - "hotpotqa:5ac3983a554299657fa290f5"
