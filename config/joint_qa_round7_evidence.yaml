    partition: "skill_confirmation_round7"
    canonical_candidate_range:
      start: 984
      stop: 1024
      zero_based_stop_exclusive: true
    per_dataset_range:
      start: 0
      stop: 40
      zero_based_stop_exclusive: true
  reserved_grpo_training_positions:
    hotpotqa: 9
    triviaqa: 12

paired_intervention:
  estimand: "stage-conditioned Skill prompt-prior assignment intent-to-treat effect"
  intervention_scope: >-
    The candidate prompt prior is eligible only on Director turns whose resolved
    graph_stage exactly matches its preregistered condition: construction for
    semantic verification, or before_final_answer for exact answer handoff. No
    candidate is visible on empty_graph turns.
  incumbent_prompt_prior: null
  treatment_assigned_from_shared_empty_canvas: true
  randomized_arm_order: true
  shared_task_and_sampling_coordinates: true
  terminal_primary_outcome: "official_answer_token_f1"
  companion_outcome: "normalized_exact_match"
  forced_probe: true
  grpo_eligible: false
  benchmark_eligible: false

skill_gate:
  scope: "independent_per_dataset"
  datasets: [hotpotqa, triviaqa]
  delta_min: 0.03
  max_harm_probability: 0.05
  minimum_effective_pairs: 20
  minimum_empirical_coverage: 0.9
  minimum_independent_problems: 20
  minimum_positive_slice_fraction: 0.75
  lower_thresholds_for_round7: false
  activation: "delayed_until_independent_confirmation_passes"
  downstream_joint_training_precondition: "both_dataset_skills_active"

epochs:
  discovery: 18
  validation: 19
  eligible_activation: 20
discovery_schedule: "balanced cold start, posterior-UCB prefilter, then particle EVSI"
evsi_budget:
  ucb_prefilter_top_k: 2
  posterior_particles: 1024
  observation_samples: 2048

data_exclusion_contract:
  confirmation_excluded_from_grpo: true
  confirmation_excluded_from_reported_development_and_test_metrics: true
  final_test_untouched: true
  prior_discovery_development_test_confirmation_overlap_allowed: false

runner_compatibility:
  current_runner_supports_exact_stage_condition: true
  reason: >-
    The candidate arm now reuses the existing per-turn SkillPromptProvider and
    SkillQuery graph-stage boundary; the incumbent arm remains prior-free.
    Exposure and condition_satisfied are derived from receipt-verified Director
    prompts before the trajectory is persisted.
  validated_by:
    - "tests/unit/test_probe_runtime_wiring.py"
    - "tests/unit/test_joint_qa_mace_skill_rounds.py"
  live_execution_allowed_after_adapter_validation: true
