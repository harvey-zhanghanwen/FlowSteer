candidate_sources:
  subject_relation_answer_type_grounding:
    round: 2
    artifact: "reports/joint_qa_progressive/skill_epoch_000002/experiment_manifest.json"
  exact_answer_handoff:
    round: 6
    artifact: "reports/joint_qa_progressive/skill_epoch_000006/experiment_manifest.json"
candidate_actions:
  subject_relation_answer_type_grounding:
    instruction: >-
      Before FINISH, perform semantic verification only when evidence contains
      competing entities, a comparison, a qualifier, an alias, or an answer
      candidate whose semantic type may differ from the question. Represent the
      supported proposition as subject, relation, answer, and qualifiers; reject
      a different subject or relation, an intermediate value, or an answer-type
      mismatch. Preserve the evidence span's language and necessary proper-name
      modifiers. Route exactly one verified answer candidate and its supporting
      span to the Output Agent, which only serializes it in one <answer> tag.
  exact_answer_handoff:
    instruction: >-
      Pass exactly one supported answer candidate to the Format Agent. The
      candidate must match the question's semantic type and preserve required
      names, modifiers, units, and evidence language. The Format Agent only
      copies that candidate into one <answer> tag; it must not shorten,
      translate, expand, or add alternatives.
candidate_conditions:
  by_candidate_and_dataset:
    subject_relation_answer_type_grounding:
      hotpotqa:
        task_family: "hotpotqa"
        graph_stage: "construction"
        tags: []
      triviaqa:
        task_family: "triviaqa"
        graph_stage: "construction"
        tags: []
    exact_answer_handoff:
      hotpotqa:
        task_family: "hotpotqa"
        graph_stage: "before_final_answer"
        tags: []
      triviaqa:
        task_family: "triviaqa"
        graph_stage: "before_final_answer"
        tags: []
baseline_action:
  instruction: "No additional prompt prior; use the frozen Director policy."
  prompt_prior: null

selection_coordinates:
  partition_manifest: "data/joint_qa_v2/manifest.json"
  train_discovery:
