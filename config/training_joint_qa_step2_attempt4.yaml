    retrieval:
      enabled: true
      mode: "deterministic_question_query_prefetch"
      query_policy: "stop_word_filtered_first_12_unique_terms"
      skillflow_source: "/home/test/SKILLEV/skillflow-bayesian-improve-deploy/src"
      index_path: "/ssd1/iclr/SKILLEV/skillev-new-b2-temp/data/datasets/dpr-wikipedia/atlas-retrieval.sqlite3"
      search_limit: 5

storage:
  schema_version: "flowsteer.agentgraph.v1"
  root: "artifacts/joint_qa_micro/step_000002_attempt_04/evidence"
  trajectory_format: "jsonl"
  deduplicate_by_event_id: true
  persist_exact_policy_receipts: true
  selected_tasks_path: "artifacts/joint_qa_micro/step_000002_attempt_04/selected_tasks.jsonl"
  retrieval_receipts_path: "artifacts/joint_qa_micro/step_000002_attempt_04/retrieval_receipts.jsonl"
  trajectories_path: "artifacts/joint_qa_micro/step_000002_attempt_04/trajectories.jsonl"
  grpo_groups_path: "artifacts/joint_qa_micro/step_000002_attempt_04/grpo_groups.jsonl"
  manifest_path: "artifacts/joint_qa_micro/step_000002_attempt_04/training_manifest.json"
  behavior_policy_preflight_path: "artifacts/joint_qa_micro/step_000002_attempt_04/behavior_policy_preflight.json"
  sync_receipt_path: "artifacts/joint_qa_micro/step_000002_attempt_04/sync_receipt.json"
  post_update_trajectories_path: "artifacts/joint_qa_micro/step_000002_attempt_04/post_update_trajectories.jsonl"

director:
  base_model: "${QWEN35_9B_MODEL_PATH:-/home/test/SKILLEV/skillev-new-b2-temp/model/Qwen3.5-9B-modelscope}"
  tokenizer_path: "${QWEN35_9B_TOKENIZER_PATH:-/home/test/SKILLEV/skillev-new-b2-temp/tokenizer/Qwen3.5-9B}"
  backend: "sglang"
  api_base: "http://127.0.0.1:${FLOWSTEER_SUPERVISOR_PORT:-8015}/v1"
  served_model_name: "supervisor_theta"
  behavior_policy_version: "qwen35-9b-jointqa-step-000001"
  behavior_adapter_name: "theta_jointqa_step_000001"
  behavior_adapter_checkpoint: "/ssd1/iclr/1/FlowSteer/artifacts/joint_qa_micro/step_000001/checkpoint/checkpoint_final/supervisor_lora/step_000001_20260818T004520962544Z/theta"
  optimizer_state_checkpoint: "/ssd1/iclr/1/FlowSteer/artifacts/joint_qa_micro/step_000001/checkpoint/checkpoint_final/supervisor_lora/step_000001_20260818T004520962544Z/theta/optimizer_state.pt"
  updated_policy_version: "qwen35-9b-jointqa-step-000002"
  expected_server_weight_version: "default"
  prompt_profile: "minimal"
  dtype: "bfloat16"
  max_context_tokens: 8192
  max_action_tokens: 512
  temperature: 1.0
  top_p: 1.0
  top_k: -1
  max_rounds: 20
  execute_on_edit: true
  history_window: 4
  lora:
    enabled: true
    rank: 64
    alpha: 128
    dropout: 0.0
    target_modules: [q_proj, k_proj, v_proj, o_proj]

agent_graph:
  max_agents: 8
  contract_type: "free_text"
  relation_encoding: "two_bit"
  actions: [add_agent, modify_agent, delete_agent, set_relation, set_output, finish]
  executor_selection: "director_catalog_choice"
  max_bidirectional_block_size: 2
  require_unique_output: true
  require_all_agents_reach_output: true
  terminal_protocol_by_source:
    hotpotqa: "exact_single_answer_tag"
    triviaqa: "exact_single_answer_tag"
  model_catalog_path: "config/model_catalog_triviaqa_v1.yaml"

evaluation:
  healthbench_judge_model: ""
  max_environment_steps: 12
  swebench_harness_enabled: false
  invalid_evaluator_action: "persist_and_exclude"

grpo:
  enabled: true
  objective: "action_masked_one_pass"
  group_key: [task_id, condition_id, policy_version]
  samples_per_problem: 8
  expected_rollout_count: 16
  advantage_epsilon: 1.0e-8
  equal_weight_per_problem: true
  terminal_task_reward_only: true
  structural_reward: 0.0
  exploration_reward: 0.0
  skill_usage_reward: 0.0
  require_valid_evaluator: true
  invalid_evaluator_action: "persist_and_exclude"
  reject_forced_probes: true
  reject_fallback_or_manual_repair: true
  reject_reconstructed_context: true
  require_exact_behavior_receipt: true
  optimization_passes_per_rollout_batch: 1
  max_optimizer_updates: 1
  exact_optimizer_continuation: true
  learning_rate: 1.0e-5
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  max_grad_norm: 1.0

policy_sync:
  enabled: true
  api_base: "http://127.0.0.1:${FLOWSTEER_SUPERVISOR_PORT:-8015}"
  load_endpoint: "/load_lora_adapter"
  unload_endpoint: "/unload_lora_adapter"
  adapter_name_prefix: "theta_jointqa_step_"
  behavior_policy_version_required: true
  adapter_checkpoint_version_required: true
  request_timeout_seconds: 120
  max_retries: 3
  retry_backoff_seconds: 2
  fail_run_on_sync_error: true
  post_update_canary_count: 2

exploration:
  enabled: false
  strategy: "none"
  forced_probe_rollouts: 0

skills:
  enabled: false
  initial_library: []
  retrieval_top_k: 0

gpu:
  learner_physical: 3
  rollout_physical: 4
  gradient_replica_physical: 5
  learner_device: "cuda:3"
  rollout_engine: "sglang"
  gradient_replica_device: "cuda:5"
  supervisor_gpu_id: 4
  supervisor_api_base: "http://127.0.0.1:8015/v1"
  training_enabled: true
  oom_policy:
    status: "active"
    micro_batch_size: 4
    minimum_micro_batch_size: 1
    micro_batch_schedule: [4, 2, 1]
    retry_on_cuda_oom: true
    split_items_across_learner_and_replica: true
    gradient_accumulation_steps: 1
    gradient_checkpointing: true

deployment:
  exploration_beta: 0.0
  allow_forced_probes: false
  active_skills_only: false
  require_version_compatible_skills: true
