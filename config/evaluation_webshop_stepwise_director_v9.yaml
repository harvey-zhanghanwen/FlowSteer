# WebShop stepwise Director v9: live parameter domains and public progress repair.
#
# Every environment Action returns its public Observation, original instruction,
# episode state, progress summary and remaining budget to the next Director turn.
# Historical full pages are compacted; complete evaluator receipts remain lossless.
# Training and Skills remain disabled.

schema_version: "flowsteer.agentgraph.config.v1"
execution_timeout: 900.0

experiment:
  name: "webshop_stepwise_director_v9"
  phase: "webshop_evaluation"
  training_enabled: false
  seed: 20260825
  condition_id: "webshop_stepwise_director_v9"
  sampling_schedule_purpose: "webshop_native_validation_stepwise_director_v1"
  catalog_order_namespace: "webshop_stepwise_v9_local_catalog"
  prompt_version: "agentgraph.director.minimal-neutral-scalar-stepwise.v2"
  tool_version: "skillflow.structured-action.webshop.stepwise-director.v9"
  output_dir: "artifacts/webshop_stepwise_director_v9/development"

data:
  catalog_path: "${FLOWSTEER_SHARED_ROOT:-/ssd1/iclr/1/FlowSteer}/config/datasets_webshop.yaml"
  registry_path: "config/datasets_runtime_webshop_initial_v1.yaml"
  registry_dataset_key: "webshop"
  train_path: "${FLOWSTEER_SHARED_ROOT:-/ssd1/iclr/1/FlowSteer}/data/webshop_v3/train.jsonl"
  validation_path: "${FLOWSTEER_SHARED_ROOT:-/ssd1/iclr/1/FlowSteer}/data/webshop_v3/validation.jsonl"
  test_path: "${FLOWSTEER_SHARED_ROOT:-/ssd1/iclr/1/FlowSteer}/data/webshop_v3/test.jsonl"
  enforce_split_isolation: true
  task_schema_version: "flowsteer.agentgraph.task.v1"

webshop_evaluation:
  dataset_key: "webshop"
  stage: "development"
  split: "validation"
  selection: "sequential"
  sample_count: 128
  stable_zero_sample_count: 2
  rollouts_per_task: 1
  concurrency: 1
  task_timeout_seconds: 900.0
  direct_model_id: "qwen3.5-9b-local"
  direct_protocol: "skillflow_ragen_webshop_react_v1"
  protocol_equivalent_to_direct: false
  direct_contract: "Return exactly one currently admissible native WebShop action."
  direct_generation_seed: 20260825
  direct_reused_from: "artifacts/webshop_initial_adapter_v5/development/direct_predictions.jsonl"

environment_runtime:
  enabled: true
  condition_id: "webshop_stepwise_director_v9"
  mode: "model_driven_ragen_react"
  dataset_scope: ["webshop"]
  ragen_adapter_path: "${FLOWSTEER_RAGEN_ADAPTER_PATH:-/home/test/SKILLEV/skillflow-bayesian-improve-deploy/src/ragen_adapter.py}"
  tool_timeout_seconds: 30.0
  max_action_tokens: 512
  max_observation_chars: 12000
  stepwise_director: true
  structured_actions: true
  max_environment_steps_by_source:
    webshop: 10

storage:
  schema_version: "flowsteer.webshop.stepwise-director.v9"
  root: "artifacts/webshop_stepwise_director_v9/development/evidence"
  selected_tasks_path: "artifacts/webshop_stepwise_director_v9/development/selected_tasks.jsonl"
  direct_predictions_path: "artifacts/webshop_stepwise_director_v9/development/direct_predictions.jsonl"
  trajectories_path: "artifacts/webshop_stepwise_director_v9/development/agentgraph_trajectories.jsonl"
  failures_path: "artifacts/webshop_stepwise_director_v9/development/collection_failures.jsonl"
  paired_results_path: "artifacts/webshop_stepwise_director_v9/development/paired_results.jsonl"
  wrong_demos_path: "artifacts/webshop_stepwise_director_v9/development/wrong_demos.jsonl"
  manifest_path: "artifacts/webshop_stepwise_director_v9/development/run_manifest.json"
  preflight_receipt_path: "artifacts/webshop_stepwise_director_v9/development/preflight_receipt.json"
  report_json_path: "reports/webshop_stepwise_director_v9/development_report.json"
  report_markdown_path: "reports/webshop_stepwise_director_v9/development_report.md"

director:
  base_model: "${QWEN35_9B_MODEL_PATH:-/home/test/SKILLEV/skillev-new-b2-temp/model/Qwen3.5-9B-modelscope}"
  tokenizer_path: "${QWEN35_9B_TOKENIZER_PATH:-/home/test/SKILLEV/skillev-new-b2-temp/tokenizer/Qwen3.5-9B}"
  backend: "sglang"
  api_base: "http://127.0.0.1:${FLOWSTEER_SUPERVISOR_PORT:-8015}/v1"
  served_model_name: "supervisor_theta"
  behavior_policy_version: "qwen35-9b-base-webshop-stepwise-director-v3"
  behavior_adapter_name: null
  behavior_adapter_checkpoint: null
  updated_policy_version: "unused-evaluation-only"
  expected_server_weight_version: "default"
  prompt_profile: "minimal"
  dtype: "bfloat16"
  max_context_tokens: 32768
  max_action_tokens: 1024
  action_decoding: "json_schema"
  action_schema_version: "agentgraph.canvas-action-json-schema.v1"
  sampling_schema_version: "agentgraph.model-admissible-action-mask.v3"
  sampling_action_profile: "model_admissible_canvas_actions"
  temperature: 1.0
  top_p: 1.0
  top_k: -1
  max_rounds: 20
  execute_on_edit: true
  history_window: 2
  lora:
    enabled: false

agent_graph:
  max_agents: 8
  contract_type: "free_text"
  relation_encoding: "two_bit"
  actions: [add_agent, modify_agent, delete_agent, set_relation, set_output, continue, finish]
  executor_selection: "director_catalog_choice"
  max_bidirectional_block_size: 2
  require_unique_output: true
  require_all_agents_reach_output: true
  require_format_agent: false
  semantic_protocol_by_source:
    webshop: "none"
  recovery_policy: "preserve_diagnose_repair_augment"
  terminal_protocol_by_source:
    webshop: "none"
  model_catalog_path: "config/model_catalog_webshop_stepwise_v9.yaml"

evaluation:
  healthbench_judge_model: ""
  max_environment_steps: 10
  max_environment_steps_by_source:
    webshop: 10
  swebench_harness_enabled: false
  invalid_evaluator_action: "persist_and_exclude"

grpo:
  enabled: false
  objective: "action_masked_one_pass"
  group_key: [task_id, condition_id, policy_version]
  samples_per_problem: 1
  advantage_epsilon: 1.0e-8
  equal_weight_per_problem: true
  terminal_task_reward_only: true
  structural_reward: 0.0
  exploration_reward: 0.0
  skill_usage_reward: 0.0
  require_valid_evaluator: true
  reject_forced_probes: true
  reject_fallback_or_manual_repair: true
  reject_reconstructed_context: true
  require_exact_behavior_receipt: true
  optimization_passes_per_rollout_batch: 0
  max_optimizer_updates: 0
  learning_rate: 0.0
  gradient_checkpointing: false
  max_grad_norm: 0.0

policy_sync:
  enabled: false
  api_base: "http://127.0.0.1:${FLOWSTEER_SUPERVISOR_PORT:-8015}"
  adapter_name_prefix: "unused_webshop_stepwise_director_v9_"
  request_timeout_seconds: 120
  max_retries: 0
  retry_backoff_seconds: 1

exploration:
  enabled: false
  strategy: "none"
  forced_probe_rollouts: 0

skills:
  enabled: false
  initial_library: []
  retrieval_top_k: 0
  library_version: "none"

gpu:
  learner_physical: 3
  rollout_physical: 0
  gradient_replica_physical: 5
  learner_device: "cuda:3"
  rollout_engine: "sglang"
  gradient_replica_device: "cuda:5"
  supervisor_gpu_id: 0
  supervisor_api_base: "http://127.0.0.1:8015/v1"
  training_enabled: false
  oom_policy:
    status: "inactive_evaluation_only"
    micro_batch_size: 1
    minimum_micro_batch_size: 1
    micro_batch_schedule: [1]
    retry_on_cuda_oom: false
    split_items_across_learner_and_replica: false
    gradient_accumulation_steps: 1
    gradient_checkpointing: false

deployment:
  exploration_beta: 0.0
  allow_forced_probes: false
  active_skills_only: false
  require_version_compatible_skills: true
